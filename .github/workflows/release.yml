name: Release
run-name: Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        type: string
      publish:
        description: Publish after verification (disable for a safe rehearsal)
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

# Repeated clicks must not interrupt uploads or start another publisher.
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  supervise:
    name: Supervise release and runner queues
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Preflight, dispatch and monitor (30-minute total budget)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python3 scripts/release.py --tag "$RELEASE_TAG" \
            --state-file "$RUNNER_TEMP/release-state.json" "${args[@]}"

      - name: Stop unfinished child after failure or cancellation
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --cancel-active --state-file "$RUNNER_TEMP/release-state.json"
