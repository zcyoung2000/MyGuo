name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify source and tag
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check tag matches app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          version = json.load(open("mygo.json", encoding="utf-8"))["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match mygo.json version {expected!r}")
          PY

      - name: Run Go tests
        run: go test ./...

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: verify
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare minimal FFmpeg
        run: ./scripts/fetch-ffmpeg.sh "darwin/${{ matrix.arch }}"

      - name: Build DMG
        env:
          CGO_ENABLED: '0'
        run: go run github.com/egoist/mygo/cmd/mygo build -platform "darwin/${{ matrix.arch }}"

      - name: Verify DMG
        run: |
          dmg="$(find "dist/darwin-${{ matrix.arch }}" -maxdepth 1 -type f -name '*.dmg' -size +0c -print -quit)"
          test -n "$dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/darwin-${{ matrix.arch }}/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build portable ZIP
        run: go run ./scripts/build-windows.go

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: dist/myguo-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.dmg *.zip > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "MyGuo ${RELEASE_TAG#v}" \
            --generate-notes
